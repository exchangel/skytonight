# Siteyi GitHub Pages'e yayınlar. main dalına her push'ta önce testler çalışır,
# geçerse yalnızca sitenin ihtiyaç duyduğu dosyalar yayınlanır.
#
# Tek seferlik kurulum: Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions

name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Yayın klasörünü hazırla (yalnızca site dosyaları)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js core data icons _site/
          rm -rf _site/data/src
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
